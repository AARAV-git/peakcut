[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peakcut"
version = "0.1.0"
description = "Annotator-aware video highlight detection with LLM-generated summaries"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "scikit-learn", "pyyaml", "duckdb", "pandas", "pyarrow", "h5py",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "python-multipart", "pydantic>=2"]
train = ["torch"]
features = ["torch", "transformers", "pillow", "opencv-python-headless"]
jax = ["jax", "optax"]
llm = ["anthropic"]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
